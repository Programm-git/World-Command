<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>World Command</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Bildschirm 1: Spielmodus wählen -->
  <section id="menu" class="screen active">
    <!-- Das Bild enthält die Buttons bereits; darüber liegen unsichtbare Klickflächen. -->
    <div class="stage">
      <button id="btn-single" class="hit" style="left:35%;top:31.1%;width:30.5%;height:13.5%" aria-label="Singleplayer"></button>
      <button id="btn-multi" class="hit" style="left:34.5%;top:46.5%;width:31.1%;height:13.5%" aria-label="Multiplayer"></button>
    </div>
  </section>

  <!-- Bildschirm 2: Land auf dem Globus auswählen -->
  <section id="globe-screen" class="screen">
    <button id="btn-back" class="back" aria-label="Zurück">←</button>
    <h1>Land auswählen</h1>
    <canvas id="globe"></canvas>
    <button id="rot-left" class="rot left" aria-label="Nach links drehen">↶</button>
    <button id="rot-right" class="rot right" aria-label="Nach rechts drehen">↷</button>
    <div id="chosen" class="chosen">Tippe auf ein farbiges Land</div>
    <button id="btn-start" class="start" disabled>Start</button>
  </section>

  <!-- Bildschirm 3: Büro des gewählten Landes -->
  <section id="office-screen" class="screen">
    <div class="stage">
      <!-- Desktop schon auf dem Bildschirm im Büro sichtbar (verkleinertes Desktop-Bild) -->
      <div class="pcscreen"><div></div></div>
      <!-- Klickfläche über dem PC-Monitor: zoomt in den Desktop -->
      <button id="btn-pc" class="hit" style="left:32.5%;top:37.2%;width:30.7%;height:38.8%" aria-label="Computer"></button>
    </div>
    <div id="desktop" class="desk">
      <!-- Zivil-Programm (Icon auf dem Desktop) -->
      <button id="btn-zivil" class="hit" style="left:7.77%;top:44.1%;width:8.37%;height:17.5%" aria-label="Zivil"></button>
    </div>
    <!-- Zivil-Ansicht: Bunkerübersicht -->
    <div id="app-zivil" class="app">
      <canvas id="app-fx" width="1672" height="941"></canvas>
      <button class="hit bunker" data-i="0" style="left:5.98%;top:18.81%;width:18.84%;height:5.95%" aria-label="Bunker 01"></button>
      <button class="hit bunker" data-i="1" style="left:5.98%;top:25.19%;width:18.84%;height:5.95%" aria-label="Bunker 02"></button>
      <button class="hit bunker" data-i="2" style="left:5.98%;top:31.46%;width:18.84%;height:5.95%" aria-label="Bunker 03"></button>
      <button class="hit bunker" data-i="3" style="left:5.98%;top:37.73%;width:18.84%;height:5.95%" aria-label="Bunker 04"></button>
      <button class="hit bunker" data-i="4" style="left:5.98%;top:44.10%;width:18.84%;height:5.95%" aria-label="Bunker 05"></button>
      <button class="hit bunker" data-i="5" style="left:5.98%;top:50.37%;width:18.84%;height:5.95%" aria-label="Bunker 06"></button>
      <button class="hit bunker" data-i="6" style="left:5.98%;top:56.85%;width:18.84%;height:5.95%" aria-label="Bunker 07"></button>
      <button class="hit bunker" data-i="7" style="left:5.98%;top:63.23%;width:18.84%;height:5.95%" aria-label="Bunker 08"></button>
      <button class="hit bunker" data-i="8" style="left:5.98%;top:69.71%;width:18.84%;height:5.95%" aria-label="Bunker 09"></button>
      <button class="hit bunker" data-i="9" style="left:5.98%;top:76.20%;width:18.84%;height:5.95%" aria-label="Bunker 10"></button>
      <!-- Upgraden: Schutzplätze -->
      <button id="btn-upg-people" class="hit" style="left:74.4%;top:35.07%;width:19.08%;height:4.46%" aria-label="Schutzplätze upgraden"></button>
      <!-- Upgraden: Vorräte, Medizin -->
      <button id="btn-upg-food" class="hit" style="left:74.52%;top:58.87%;width:19.26%;height:4.46%" aria-label="Vorräte upgraden"></button>
      <button id="btn-upg-med" class="hit" style="left:74.64%;top:81.51%;width:19.2%;height:4.04%" aria-label="Medizin upgraden"></button>
      <button id="btn-app-min" class="hit" style="left:84.75%;top:7.23%;width:2.51%;height:3.72%" aria-label="Minimieren"></button>
      <button id="btn-app-close" class="hit" style="left:91.33%;top:7.23%;width:2.51%;height:3.72%" aria-label="Schließen"></button>
    </div>
    <button id="btn-pause" class="back pause" aria-label="Pause"><span></span><span></span></button>
    <button id="btn-lean" class="back lean">Zurücklehnen</button>
    <div id="pause-menu" class="overlay" hidden>
      <div class="panel">
        <h2>Pause</h2>
        <button id="btn-resume" class="menu-btn primary">Fortsetzen</button>
        <button id="btn-quit" class="menu-btn">Zum Hauptmenü</button>
      </div>
    </div>
  </section>

  <div id="toast" class="toast"></div>

  <script src="vendor/d3.min.js"></script>
  <script src="vendor/topojson-client.min.js"></script>
  <script src="vendor/world.js"></script>
  <script src="game.js"></script>
  <script src="menu-fx.js"></script>
</body>
</html>
