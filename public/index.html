<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>World Command</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Bildschirm 1: Spielmodus wählen -->
  <section id="menu" class="screen active">
    <!-- Das Bild enthält die Buttons bereits; darüber liegen unsichtbare Klickflächen. -->
    <div class="stage">
      <button id="btn-single" class="hit" style="left:35%;top:31.1%;width:30.5%;height:13.5%" aria-label="Singleplayer"></button>
      <button id="btn-multi" class="hit" style="left:34.5%;top:46.5%;width:31.1%;height:13.5%" aria-label="Multiplayer"></button>
    </div>
  </section>

  <!-- Bildschirm 2: Land auf dem Globus auswählen -->
  <section id="globe-screen" class="screen">
    <button id="btn-back" class="back" aria-label="Zurück">←</button>
    <h1>Land auswählen</h1>
    <canvas id="globe"></canvas>
    <button id="rot-left" class="rot left" aria-label="Nach links drehen">↶</button>
    <button id="rot-right" class="rot right" aria-label="Nach rechts drehen">↷</button>
    <div id="chosen" class="chosen">Tippe auf ein farbiges Land</div>
    <button id="btn-start" class="start" disabled>Start</button>
  </section>

  <!-- Bildschirm 3: Büro des gewählten Landes -->
  <section id="office-screen" class="screen">
    <div id="office" class="office"></div>
    <button id="btn-pause" class="back pause" aria-label="Pause"><span></span><span></span></button>
    <div id="pause-menu" class="overlay" hidden>
      <div class="panel">
        <h2>Pause</h2>
        <button id="btn-resume" class="menu-btn primary">Fortsetzen</button>
        <button id="btn-quit" class="menu-btn">Zum Hauptmenü</button>
      </div>
    </div>
  </section>

  <div id="toast" class="toast"></div>

  <script src="vendor/d3.min.js"></script>
  <script src="vendor/topojson-client.min.js"></script>
  <script src="vendor/world.js"></script>
  <script src="game.js"></script>
</body>
</html>
